<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel - Coding Mentor Bot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.08); }
  header { padding: 14px 18px; background: #4f46e5; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header button { background: rgba(255,255,255,.2); color: #fff; border: 0; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #e2e8f0; color: #0f172a; border-bottom-left-radius: 4px; }
  .error { align-self: center; background: #fee2e2; color: #991b1b; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
  input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
  form button { padding: 0 20px; background: #4f46e5; color: #fff; border: 0; border-radius: 10px; cursor: pointer; font-size: 15px; }
  form button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header><h1>Pixel - your coding mentor</h1><button id="reset">New chat</button></header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask me anything about coding..." autocomplete="off" maxlength="2000">
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let conversationId = crypto.randomUUID();

  function addMessage(text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;           // textContent = safe from HTML injection
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addMessage("Hi! I'm Pixel, your coding mentor. What would you like to learn today?", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;
    const typing = addMessage("Pixel is typing...", "bot");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conversationId, message: text }),
      });
      const data = await res.json();
      typing.remove();
      if (data.error) addMessage(data.error, "error");
      else addMessage(data.reply, "bot");
    } catch (err) {
      typing.remove();
      addMessage("Cannot reach the server. Is it running?", "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId }),
    }).catch(() => {});
    conversationId = crypto.randomUUID();
    messagesEl.innerHTML = "";
    addMessage("New chat started! What would you like to learn?", "bot");
  });
</script>
</body>
</html>
